name: Sync and Build Rive Docs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout forked repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/rive-app/rive-docs.git || true
          git fetch upstream main
          git config user.email "bot@github.com"
          git config user.name "Sync Bot"
          git merge upstream/main --allow-unrelated-histories -m "Sync upstream" || {
            git merge --abort
            echo "Merge conflict detected, skipping merge."
          }
          if ! git diff --quiet origin/main; then
            git push origin main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mintlify
        run: npm install -g mintlify

      - name: Build docs
        run: |
          echo "Running mintlify export..."
          mintlify export || true

          if [ -f "export.zip" ]; then
            echo "Found export.zip - unzipping into out/"
            mkdir -p out
            unzip -q export.zip -d out
            echo "Unzip complete. Contents:"
            ls -la out/ | head -20
          elif [ -f ".mintlify/export.zip" ]; then
            echo "Found .mintlify/export.zip - unzipping into out/"
            mkdir -p out
            unzip -q .mintlify/export.zip -d out
          else
            echo "No export.zip found. Building static HTML from .mdx files."
            mkdir -p out
            find . -name "*.mdx" -not -path "./.git/*" -not -path "./out/*" | sort > out/file-list.txt
            echo '<html><head><title>Rive Docs Mirror</title></head><body><h1>Rive Docs</h1><ul>' > out/index.html
            while IFS= read -r f; do
              fname=$(echo "$f" | sed 's|^./||' | tr '/' '_')
              cp "$f" "out/$fname" 2>/dev/null || true
              echo "<li><a href=\"$fname\">$f</a></li>" >> out/index.html
            done < out/file-list.txt
            echo '</ul></body></html>' >> out/index.html
          fi

          echo "Final output:"
          ls -la out/ | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
