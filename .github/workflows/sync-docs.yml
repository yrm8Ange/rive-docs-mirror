name: Deploy Rive Docs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Clone Rive docs
        run: git clone https://github.com/rive-app/rive-docs.git docs-source

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs-source'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
